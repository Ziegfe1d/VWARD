server.modules = (
    "mod_cgi",
    "mod_setenv"
)

server.document-root = "/opt/share/vward/console/www"
server.bind = "192.168.1.1"
server.port = 8088

server.pid-file = "/opt/var/run/vward-console-lighttpd.pid"
server.errorlog = "/opt/var/log/vward-console-lighttpd.log"
server.tag = "VWARD"

dir-listing.activate = "disable"
url.access-deny = ( "~", ".inc", ".bak", ".old", ".orig", ".save", ".swp" )

setenv.add-response-header = (
    "Cache-Control" => "no-store",
    "Content-Security-Policy" => "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'",
    "Permissions-Policy" => "camera=(), geolocation=(), microphone=()",
    "Referrer-Policy" => "no-referrer",
    "X-Content-Type-Options" => "nosniff",
    "X-Frame-Options" => "DENY"
)

index-file.names = (
    "index.html"
)

cgi.assign = (
    ".cgi" => ""
)

mimetype.assign = (
    ".html" => "text/html",
    ".htm"  => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ".txt"  => "text/plain"
)
