server.modules = (
    "mod_cgi",
    "mod_setenv"
)

server.document-root = "/opt/share/vward/console/www"
server.bind = "@VWARD_CONSOLE_BIND@"
server.port = @VWARD_CONSOLE_PORT@

server.pid-file = "/opt/var/run/vward-console-lighttpd.pid"
server.errorlog = "/opt/var/log/vward-console-lighttpd.log"
server.tag = "VWARD"

dir-listing.activate = "disable"
url.access-deny = ( "~", ".inc", ".bak", ".old", ".orig", ".save", ".swp" )

setenv.add-response-header = (
    # Page and assets are revalidated by ETag (304 without a body); api.cgi
    # adds its own "no-store", which wins for every API answer.
    "Cache-Control" => "no-cache",
    "Content-Security-Policy" => "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'",
    "Permissions-Policy" => "camera=(), geolocation=(), microphone=()",
    "Referrer-Policy" => "no-referrer",
    "X-Content-Type-Options" => "nosniff",
    "X-Frame-Options" => "DENY"
)

index-file.names = (
    "index.html"
)

cgi.assign = (
    ".cgi" => ""
)

mimetype.assign = (
    ".html" => "text/html",
    ".htm"  => "text/html",
    ".css"  => "text/css",
    ".js"   => "application/javascript",
    ".json" => "application/json",
    ".txt"  => "text/plain"
)
