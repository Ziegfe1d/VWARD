<!--
VWARD Console integration fragment. Do not paste blindly: merge into the current
single-page Console card/detail model and reuse existing stat(), badge(),
postConsoleAction(), help and responsive styles.
-->

<!-- Dashboard card candidate -->
<div class="card" id="adsCard" tabindex="0" role="button" aria-label="VWARD Ads &amp; Privacy Guard">
  <div class="card-head">
    <div class="name"><i aria-hidden="true"><svg viewBox="0 0 24 24" width="21" height="21" fill="none"><path d="M12 3 19 6v5c0 4.6-2.8 8-7 10-4.2-2-7-5.4-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m8.7 12 2.1 2.1 4.7-4.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></i><div><h3>Ads &amp; Privacy Guard</h3><small>Реклама и приватность VWARD</small></div></div>
    <span class="pill" id="adsPill">Нет данных</span>
  </div>
  <div class="metric" id="adsMetric">-</div>
  <div class="metric-sub">подтверждено блокировок</div>
  <div class="arrow">›</div>
</div>

<!-- Detail panel candidate -->
<div class="panel" id="adsDetailPanel">
  <div class="panel-head">
    <div><h2>VWARD Ads &amp; Privacy Guard</h2><div class="sub">Реклама, трекинг, аналитика и нежелательные редиректы</div></div>
    <button class="btn" data-icon="refresh" id="adsRefresh">Обновить</button>
  </div>
  <div class="stats" id="adsStats"></div>
  <div class="notice" style="margin-top:14px">Автоблокировка требует подтвержденного feed evidence. Эвристика сама по себе не блокирует.</div>
  <div class="actions action-wrap">
    <button class="btn" data-icon="scan" id="adsScan">Проверить сейчас</button>
    <button class="btn" data-icon="refresh" id="adsSources">Обновить базы</button>
    <button class="btn" data-icon="pause" id="adsPause">Пауза</button>
    <button class="btn" data-icon="settings" data-section="settings" id="adsOpenSettings">Настройки</button>
  </div>
  <div class="sub" id="adsCurrentWork" style="margin-top:8px">Текущая проверка: нет данных</div>
  <div class="components" id="adsReviewList"></div>
</div>

<script>
let adsData=null;
async function loadAdsData(show=false){
  const r=await fetch('/cgi-bin/api.cgi?action=ads-data&_='+Date.now(),{cache:'no-store'}),x=await r.json();
  if(!x.ok)throw Error(x.error||'ads_data_failed'); adsData=x;
  const c=x.counts||{},l=x.last||{},s=x.sources||{},rt=x.runtime||{},sch=x.scheduler||{};
  badge('adsPill',Number(c.review||0)===0,'Блок '+(c.blocked||0));
  txt('adsMetric',c.blocked||0);
  $('adsStats').innerHTML=stat([
    ['BLOCK',c.blocked||0],['На проверке',c.review||0],['ALLOW cache',c.allow||0],['Trusted',c.trust||0],
    ['Разрешённых записей',l.allowed_records||'-'],['Уникальных доменов',l.unique_allowed||'-'],
    ['Evidence sources',s.healthy_indexes||'-'],['Последний цикл',l.last_run||'-']
  ]);
  txt('adsCurrentWork','Текущая проверка: '+(rt.phase||sch.phase||'ожидание')+(rt.domain?' · '+rt.domain:'')+(rt.total?(' · '+(rt.current||0)+'/'+rt.total):''));
  $('adsPause').textContent=x.paused?'Продолжить':'Пауза';
  $('adsReviewList').innerHTML=(x.review_queue||[]).length?(x.review_queue||[]).map(v=>
    '<div class="row"><b>'+esc(v.domain)+'<small>'+esc(v.reason||'')+'</small></b><span>'+esc(v.confidence||'')+'</span><span class="pill warn">'+esc(v.action==='BLOCK'?'BLOCK · review':'review')+'</span></div>'
  ).join(''):'<div class="empty">Очередь проверки пуста</div>';
  if(typeof renderAdsSettingsRuntime==='function')renderAdsSettingsRuntime(x);
  if(show)notify('Ads & Privacy Guard обновлён');
}
$('adsRefresh').onclick=()=>loadAdsData(true);
$('adsScan').onclick=()=>postConsoleAction('ads-control','scan','', 'routeActionResult').then(()=>loadAdsData(false));
$('adsSources').onclick=()=>postConsoleAction('ads-control','sources-update','', 'routeActionResult').then(()=>loadAdsData(false));
$('adsPause').onclick=()=>postConsoleAction('ads-control',adsData&&adsData.paused?'resume':'pause','', 'routeActionResult').then(()=>loadAdsData(false));
$('adsOpenSettings').onclick=()=>go('settings');
</script>
