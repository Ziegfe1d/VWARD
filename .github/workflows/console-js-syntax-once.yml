name: One-shot Console JavaScript syntax check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/console-js-syntax-once.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and parse inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.index('</script>', start)
          Path('/tmp/vward-console.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/vward-console.js
