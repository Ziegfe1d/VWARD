name: One-shot final VWARD Console control plane

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-control-plane-once.yml'
      - '.github/scripts/control-plane-final-once.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final safe control-plane pass
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/control-plane-final-once.py

          python3 - <<'PY'
          from pathlib import Path

          # Existing binding assertion expected route-data to be the final item in a case arm.
          p = Path('tests/repository/check-console-bindings.py')
          s = p.read_text(encoding='utf-8')
          old = "if 'action=route-data' not in html or 'route-data)' not in api:"
          new = "if 'action=route-data' not in html or 'route-data' not in api:"
          if s.count(old) != 1:
              raise SystemExit('route-data assertion marker mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Component actions must yield to an updater transaction. Update Engine actions
          # themselves delegate lock/recovery semantics to the updater state machine.
          p = Path('web/cgi-bin/api.cgi')
          s = p.read_text(encoding='utf-8')
          old = '''    [ ! -e /opt/var/run/vward/updater.lock ] || {
        echo '{"ok":false,"error":"updater_busy"}'
        exit 0
    }

    CMD=""; ARG=""; REQUIRED=""; LABEL=""
'''
          new = '''    if [ "$ACTION" = control ] && [ -e /opt/var/run/vward/updater.lock ]; then
        echo '{"ok":false,"error":"updater_busy"}'
        exit 0
    fi

    CMD=""; ARG=""; REQUIRED=""; LABEL=""
'''
          if s.count(old) != 1:
              raise SystemExit('updater lock guard marker mismatch')
          s = s.replace(old, new, 1)

          # Keep the IPv4/CIDR matcher BusyBox/POSIX awk compatible.
          old = '''        {split($0,b,"/"); if(length(b)!=2) next; net=ipn(b[1]); p=b[2]+0; if(p<0||p>32) next; size=2^(32-p); base=int(net/size)*size; if(target>=base && target<base+size){print $0; exit}}
'''
          new = '''        {n=split($0,b,"/"); if(n!=2) next; net=ipn(b[1]); p=b[2]+0; if(p<0||p>32) next; size=2^(32-p); base=int(net/size)*size; if(target>=base && target<base+size){print $0; exit}}
'''
          if s.count(old) != 1:
              raise SystemExit('CIDR matcher marker mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/final-control-plane-once.yml
          git rm .github/scripts/control-plane-final-once.py

          tmp="$RUNNER_TEMP/SHA256SUMS"
          : > "$tmp"
          while IFS= read -r f; do
            [ "$f" = "SHA256SUMS" ] && continue
            sha256sum "$f" >> "$tmp"
          done < <(git ls-files | LC_ALL=C sort)
          mv "$tmp" SHA256SUMS

      - name: Validate repository, Console and updater
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/repository/check-console-bindings.py
          tests/repository/run-consistency-checks.sh
          sh -n web/cgi-bin/api.cgi
          sha256sum -c SHA256SUMS
          tests/updater/run-simulations.sh
          tests/updater/run-fix-pass-1-simulations.sh
          tests/updater/run-fix-pass-2-simulations.sh
          tests/updater/run-fix-pass-3-simulations.sh

      - name: Commit final safe control-plane pass
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finish safe Console control-plane actions and diagnostics'
          git push origin HEAD:main
