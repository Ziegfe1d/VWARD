name: One-shot Route Engine read-only Console integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/route-readonly-once.yml'
      - '.github/scripts/route-readonly-once.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply read-only Route Engine integration
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/route-readonly-once.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/repository/run-consistency-checks.sh')
          s = p.read_text(encoding='utf-8')
          old = '''grep -Fq "if(id==='logs')loadLogs(false);renderHelp();setHelp(false);window.scrollTo(0,0)" web/index.html ||\n    fail "Logs/help must update before compatibility-safe scroll"'''
          new = '''grep -Fq "if(id==='logs')loadLogs(false);if(id==='route')loadRouteData(false);renderHelp();setHelp(false);window.scrollTo(0,0)" web/index.html ||\n    fail "Logs/route-data/help must update before compatibility-safe scroll"'''
          if s.count(old) != 1:
              raise SystemExit('route navigation consistency assertion mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/route-readonly-once.yml
          git rm .github/scripts/route-readonly-once.py

          tmp="$RUNNER_TEMP/SHA256SUMS"
          : > "$tmp"
          while IFS= read -r f; do
            [ "$f" = "SHA256SUMS" ] && continue
            sha256sum "$f" >> "$tmp"
          done < <(git ls-files | LC_ALL=C sort)
          mv "$tmp" SHA256SUMS

      - name: Validate repository and updater
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/repository/check-console-bindings.py
          tests/repository/run-consistency-checks.sh
          sh -n web/cgi-bin/api.cgi
          sha256sum -c SHA256SUMS
          tests/updater/run-simulations.sh
          tests/updater/run-fix-pass-1-simulations.sh
          tests/updater/run-fix-pass-2-simulations.sh
          tests/updater/run-fix-pass-3-simulations.sh

      - name: Commit read-only integration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Expose Route Engine catalogs read-only in Console'
          git push origin HEAD:main
