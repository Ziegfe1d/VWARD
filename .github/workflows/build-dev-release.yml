name: Build VWARD dev candidate

on:
  workflow_dispatch:
    inputs:
      sequence:
        description: Monotonic update sequence for a signed candidate
        required: false
        type: string
      min_vward:
        description: Minimum installed VWARD version
        required: false
        default: 0.1.7-beta
        type: string
  push:
    branches:
      - dev
    paths:
      - VERSION
      - SHA256SUMS
      - components/**
      - config/components/**
      - config/settings/**
      - scripts/build-update-candidate.sh
      - web/**
      - .github/workflows/build-dev-release.yml

permissions:
  contents: read

concurrency:
  group: vward-dev-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    env:
      VWARD_SIGNING_KEY_PEM: ${{ secrets.VWARD_PROD_ED25519_PRIVATE_KEY_PEM }}
      VWARD_SIGNING_KEY_LEGACY: ${{ secrets.VWARD_PROD_ED25519_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq openssl dash

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          tests/repository/run-consistency-checks.sh
          tests/run-package-validation.sh
          for file in components/update-engine/*.sh tests/updater/*.sh; do
            sh -n "$file"
            dash -n "$file"
          done
          sha256sum -c SHA256SUMS

      - name: Build complete reproducible candidate
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/vward-candidate"
          bash scripts/build-update-candidate.sh "$OUT"
          test "$(jq '.files | length' "$OUT/package-manifest.json")" = "$(awk -F '\t' '!/^#/ && NF {n++} END {print n+0}' config/components/package-map.tsv)"
          echo "VWARD_OUT=$OUT" >> "$GITHUB_ENV"
          echo "VWARD_ARTIFACT=$(find "$OUT" -maxdepth 1 -name 'vward-*.tar.gz' -type f -print -quit)" >> "$GITHUB_ENV"

      - name: Prepare signed manifest when production key is available
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          INPUT_SEQUENCE: ${{ inputs.sequence }}
          INPUT_MIN_VWARD: ${{ inputs.min_vward }}
        run: |
          set -euo pipefail
          [ -n "$INPUT_SEQUENCE" ] || { echo "::error::sequence is required for a signed candidate"; exit 2; }
          case "$INPUT_SEQUENCE" in *[!0-9]*|'') echo "::error::sequence must be a positive integer"; exit 2 ;; esac
          KEY="$RUNNER_TEMP/vward-prod-key.pem"
          if [ -n "${VWARD_SIGNING_KEY_PEM:-}" ]; then
            printf '%s\n' "$VWARD_SIGNING_KEY_PEM" > "$KEY"
          elif [ -n "${VWARD_SIGNING_KEY_LEGACY:-}" ]; then
            printf '%s\n' "$VWARD_SIGNING_KEY_LEGACY" > "$KEY"
          else
            echo "::error::Production Ed25519 signing key is not configured"
            exit 78
          fi
          chmod 600 "$KEY"
          private_pub="$(openssl pkey -in "$KEY" -pubout -outform DER | sha256sum | awk '{print $1}')"
          trusted_pub="$(openssl pkey -pubin -in config/updater/update-public.pem -outform DER | sha256sum | awk '{print $1}')"
          [ "$private_pub" = "$trusted_pub" ] || { echo "::error::Signing key does not match trusted public key"; exit 31; }

          VERSION="$(sed -n '1p' VERSION)"
          PACKAGE_SHA="$(jq -r '.package_sha256' "$VWARD_OUT/candidate-metadata.json")"
          PACKAGE_SIZE="$(jq -r '.package_size' "$VWARD_OUT/candidate-metadata.json")"
          UNPACKED_SIZE="$(jq -r '.unpacked_size' "$VWARD_OUT/candidate-metadata.json")"
          COMPONENTS="$(awk -F '\t' '!/^#/ && NF {print $1}' config/components/package-map.tsv | LC_ALL=C sort -u | jq -R . | jq -s .)"
          PUBLISHED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          URL="https://raw.githubusercontent.com/Ziegfe1d/VWARD/dev/updates/dev/packages/vward-$VERSION.tar.gz"
          jq -n --arg version "$VERSION" --arg update_id "vward-$VERSION" --argjson sequence "$INPUT_SEQUENCE" \
            --arg published_at "$PUBLISHED_AT" --arg url "$URL" --arg sha256 "$PACKAGE_SHA" \
            --argjson size "$PACKAGE_SIZE" --argjson unpacked_size "$UNPACKED_SIZE" \
            --arg min_vward "$INPUT_MIN_VWARD" --argjson components "$COMPONENTS" \
            '{schema:1,update_id:$update_id,sequence:$sequence,version:$version,channel:"dev",priority:"ROUTINE",published_at:$published_at,min_updater_version:"1.2.0",package:{url:$url,sha256:$sha256,size:$size,unpacked_size:$unpacked_size},compatibility:{min_vward:$min_vward,max_vward:$version},affected_components:$components,affected_services:[],health_profile:"default",requires_reboot:false,rollback_policy:"automatic",signature:{algorithm:"Ed25519",key_id:"vward-prod-2026-01"}}' > "$VWARD_OUT/signed.json"
          jq -cS . "$VWARD_OUT/signed.json" > "$VWARD_OUT/signed.canonical.json"
          openssl pkeyutl -sign -inkey "$KEY" -rawin -in "$VWARD_OUT/signed.canonical.json" -out "$VWARD_OUT/signature.bin"
          SIGNATURE="$(openssl base64 -A -in "$VWARD_OUT/signature.bin")"
          jq -n --slurpfile signed "$VWARD_OUT/signed.json" --arg signature "$SIGNATURE" '{signed:$signed[0],signature:$signature}' > "$VWARD_OUT/update-manifest.json"
          jq -cS '.signed' "$VWARD_OUT/update-manifest.json" > "$VWARD_OUT/verify.canonical.json"
          jq -r '.signature' "$VWARD_OUT/update-manifest.json" | openssl base64 -d -A > "$VWARD_OUT/verify.signature.bin"
          openssl pkeyutl -verify -pubin -inkey config/updater/update-public.pem -rawin -in "$VWARD_OUT/verify.canonical.json" -sigfile "$VWARD_OUT/verify.signature.bin"

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: vward-dev-candidate-${{ github.sha }}
          path: |
            ${{ env.VWARD_OUT }}/vward-*.tar.gz
            ${{ env.VWARD_OUT }}/package-manifest.json
            ${{ env.VWARD_OUT }}/candidate-metadata.json
            ${{ env.VWARD_OUT }}/update-manifest.json
          if-no-files-found: error
          retention-days: 7
