name: One-shot repository SHA256 regeneration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-sha-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate, verify and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refresh-sha-once.yml
          tmp="$RUNNER_TEMP/SHA256SUMS"
          : > "$tmp"
          while IFS= read -r f; do
            [ "$f" = "SHA256SUMS" ] && continue
            sha256sum "$f" >> "$tmp"
          done < <(git ls-files | LC_ALL=C sort)
          mv "$tmp" SHA256SUMS
          sha256sum -c SHA256SUMS
          git add SHA256SUMS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate repository SHA256 manifest'
          git push origin HEAD:main
