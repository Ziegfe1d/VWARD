name: Sync router AdaptiveAuto observability

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-router-adaptive-observability.yml'

permissions:
  contents: write

concurrency:
  group: vward-router-observability-sync
  cancel-in-progress: false

jobs:
  sync-router-observability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source baseline
        shell: bash
        run: |
          set -euo pipefail
          FILE='components/adaptive-routing/scripts/agh-adaptive-live.sh'
          EXPECTED='be0e99f1c927450c5afb70cd8d83c14e8502b54f5493f8b39d9ac15d24566a1b'
          ACTUAL="$(sha256sum "$FILE" | awk '{print $1}')"
          echo "SOURCE_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Apply the already accepted router logging change
        shell: python3
        run: |
          from pathlib import Path

          path = Path('components/adaptive-routing/scripts/agh-adaptive-live.sh')
          text = path.read_text(encoding='utf-8')

          direct_old = '''    if probe "$H" "$WAN" "$GIP"; then
              save_state "$H" "DIRECT_OK"
              echo "$(date '+%Y-%m-%d %H:%M:%S')|ADD_ABORT_DIRECT_RECOVERED|$H" >> "$EVENT_LOG"
              change_unlock
              return 0
          fi

          if ! probe "$H" "$WG" "$GIP"; then
          '''
          direct_new = '''    if probe "$H" "$WAN" "$GIP"; then
              save_state "$H" "DIRECT_OK"
              echo "$(date '+%Y-%m-%d %H:%M:%S')|ADD_ABORT_DIRECT_RECOVERED|$H" >> "$EVENT_LOG"
              change_unlock
              return 0
          fi

          DIRECT_RC=$P_RC
          DIRECT_CODE=$P_CODE
          DIRECT_TIME=$P_TIME

          if ! probe "$H" "$WG" "$GIP"; then
          '''

          vpn_old = '''    if ! probe "$H" "$WG" "$GIP"; then
              save_state "$H" "ISP_FAIL_WG_FAIL"
              echo "$(date '+%Y-%m-%d %H:%M:%S')|ADD_ABORT_WG_FAIL|$H" >> "$EVENT_LOG"
              change_unlock
              return 0
          fi

          OUT=$(ndmc -c "object-group fqdn $GROUP include $H" 2>&1)
          '''
          vpn_new = '''    if ! probe "$H" "$WG" "$GIP"; then
              save_state "$H" "ISP_FAIL_WG_FAIL"
              echo "$(date '+%Y-%m-%d %H:%M:%S')|ADD_ABORT_WG_FAIL|$H" >> "$EVENT_LOG"
              change_unlock
              return 0
          fi

          VPN_RC=$P_RC
          VPN_CODE=$P_CODE
          VPN_TIME=$P_TIME

          OUT=$(ndmc -c "object-group fqdn $GROUP include $H" 2>&1)
          '''

          log_old = '''        echo "$(date '+%Y-%m-%d %H:%M:%S')|AUTO_VPN|$H|$GROUP" \\
              >> "$EVENT_LOG"
          '''
          log_new = '''        echo "$(date '+%Y-%m-%d %H:%M:%S')|AUTO_VPN|$H|$GROUP|reason=DIRECT_UNAVAILABLE_VPN_OK|ip=$GIP|dns=IPV4_OK|adguard=NOT_BLOCKED|direct_rc=$DIRECT_RC|direct_http=$DIRECT_CODE|direct_time=$DIRECT_TIME|vpn_rc=$VPN_RC|vpn_http=$VPN_CODE|vpn_time=$VPN_TIME" \\
              >> "$EVENT_LOG"
          '''

          for label, old in [('direct capture', direct_old), ('vpn capture', vpn_old), ('reason log', log_old)]:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'FAIL: {label} marker count={count}, expected=1')

          text = text.replace(direct_old, direct_new, 1)
          text = text.replace(vpn_old, vpn_new, 1)
          text = text.replace(log_old, log_new, 1)

          required = [
              'DIRECT_RC=$P_RC',
              'DIRECT_CODE=$P_CODE',
              'DIRECT_TIME=$P_TIME',
              'VPN_RC=$P_RC',
              'VPN_CODE=$P_CODE',
              'VPN_TIME=$P_TIME',
              'reason=DIRECT_UNAVAILABLE_VPN_OK',
              'adguard=NOT_BLOCKED',
              'direct_http=$DIRECT_CODE',
              'vpn_http=$VPN_CODE',
          ]
          for marker in required:
              if text.count(marker) != 1:
                  raise SystemExit(f'FAIL: post-patch marker {marker!r} count={text.count(marker)}')

          path.write_text(text, encoding='utf-8')
          print('PATCH_STRUCTURE=PASS')

      - name: Syntax and scope checks
        shell: bash
        run: |
          set -euo pipefail
          FILE='components/adaptive-routing/scripts/agh-adaptive-live.sh'
          dash -n "$FILE"
          test "$(grep -F -c 'reason=DIRECT_UNAVAILABLE_VPN_OK' "$FILE")" -eq 1
          test "$(grep -F -c 'DIRECT_RC=$P_RC' "$FILE")" -eq 1
          test "$(grep -F -c 'VPN_RC=$P_RC' "$FILE")" -eq 1
          echo 'SYNTAX_SCOPE=PASS'

      - name: Remove one-shot workflow and refresh repository hashes
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/sync-router-adaptive-observability.yml'
          tmp="$RUNNER_TEMP/SHA256SUMS"
          : > "$tmp"
          while IFS= read -r f; do
            [ "$f" = 'SHA256SUMS' ] && continue
            sha256sum "$f" >> "$tmp"
          done < <(git ls-files | LC_ALL=C sort)
          mv "$tmp" SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Repository consistency checks
        shell: bash
        run: |
          set -euo pipefail
          tests/repository/run-consistency-checks.sh
          sha256sum -c SHA256SUMS

      - name: Commit canonical source sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/adaptive-routing/scripts/agh-adaptive-live.sh SHA256SUMS
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 1; }
          git commit -m 'Sync accepted AdaptiveAuto reason logging from router'
          git push origin HEAD:main
