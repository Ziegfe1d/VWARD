name: Sync router AdaptiveAuto observability

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-router-adaptive-observability.yml'

permissions:
  contents: write

concurrency:
  group: vward-router-observability-sync
  cancel-in-progress: false

jobs:
  sync-router-observability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact source baseline
        shell: bash
        run: |
          set -euo pipefail
          FILE='components/adaptive-routing/scripts/agh-adaptive-live.sh'
          EXPECTED='be0e99f1c927450c5afb70cd8d83c14e8502b54f5493f8b39d9ac15d24566a1b'
          ACTUAL="$(sha256sum "$FILE" | awk '{print $1}')"
          echo "SOURCE_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Diagnose exact add_adaptive structure
        shell: bash
        run: |
          set -euo pipefail
          FILE='components/adaptive-routing/scripts/agh-adaptive-live.sh'
          echo "ADD_FUNCTIONS=$(grep -F -c 'add_adaptive()' "$FILE")"
          echo "DIRECT_MARKERS=$(grep -F -c 'if probe "$H" "$WAN" "$GIP"; then' "$FILE")"
          echo "WG_MARKERS=$(grep -F -c 'if ! probe "$H" "$WG" "$GIP"; then' "$FILE")"
          echo "AUTO_VPN_LOGS=$(grep -F -c '|AUTO_VPN|$H|$GROUP"' "$FILE")"
          test "$(grep -F -c 'add_adaptive()' "$FILE")" -eq 1

      - name: Apply accepted router logging change inside add_adaptive only
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('components/adaptive-routing/scripts/agh-adaptive-live.sh')
          text = path.read_text(encoding='utf-8')

          start_marker = 'add_adaptive()\n{\n'
          end_marker = '\n\n# ------------------------------------------------------------\n# REMOVE FROM VPN -> DIRECT'

          if text.count(start_marker) != 1:
              raise SystemExit(f'FAIL: add_adaptive start count={text.count(start_marker)}')

          start = text.index(start_marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          lines = body.splitlines(keepends=True)

          direct_line = '    if probe "$H" "$WAN" "$GIP"; then\n'
          wg_line = '    if ! probe "$H" "$WG" "$GIP"; then\n'
          ndmc_line = '    OUT=$(ndmc -c "object-group fqdn $GROUP include $H" 2>&1)\n'

          def unique_index(line, label):
              hits = [i for i, value in enumerate(lines) if value == line]
              if len(hits) != 1:
                  raise SystemExit(f'FAIL: {label} count={len(hits)}, expected=1 in add_adaptive')
              return hits[0]

          direct_i = unique_index(direct_line, 'direct probe')
          wg_i = unique_index(wg_line, 'wg probe')
          ndmc_i = unique_index(ndmc_line, 'ndmc add')

          if not (direct_i < wg_i < ndmc_i):
              raise SystemExit('FAIL: unexpected add_adaptive marker order')

          direct_fi = next((i for i in range(direct_i + 1, wg_i) if lines[i] == '    fi\n'), None)
          if direct_fi is None:
              raise SystemExit('FAIL: direct probe closing fi not found')

          lines[direct_fi + 1:direct_fi + 1] = [
              '\n',
              '    DIRECT_RC=$P_RC\n',
              '    DIRECT_CODE=$P_CODE\n',
              '    DIRECT_TIME=$P_TIME\n',
          ]

          wg_i = unique_index(wg_line, 'wg probe after direct capture')
          ndmc_i = unique_index(ndmc_line, 'ndmc add after direct capture')
          wg_fi = next((i for i in range(wg_i + 1, ndmc_i) if lines[i] == '    fi\n'), None)
          if wg_fi is None:
              raise SystemExit('FAIL: wg probe closing fi not found')

          lines[wg_fi + 1:wg_fi + 1] = [
              '\n',
              '    VPN_RC=$P_RC\n',
              '    VPN_CODE=$P_CODE\n',
              '    VPN_TIME=$P_TIME\n',
          ]

          log_hits = [
              i for i, value in enumerate(lines)
              if '|AUTO_VPN|$H|$GROUP" \\' in value
          ]
          if len(log_hits) != 1:
              raise SystemExit(f'FAIL: AUTO_VPN reason-log target count={len(log_hits)}, expected=1 in add_adaptive')

          i = log_hits[0]
          old = '|AUTO_VPN|$H|$GROUP"'
          new = '|AUTO_VPN|$H|$GROUP|reason=DIRECT_UNAVAILABLE_VPN_OK|ip=$GIP|dns=IPV4_OK|adguard=NOT_BLOCKED|direct_rc=$DIRECT_RC|direct_http=$DIRECT_CODE|direct_time=$DIRECT_TIME|vpn_rc=$VPN_RC|vpn_http=$VPN_CODE|vpn_time=$VPN_TIME"'
          if lines[i].count(old) != 1:
              raise SystemExit('FAIL: AUTO_VPN log replacement marker mismatch')
          lines[i] = lines[i].replace(old, new, 1)

          new_body = ''.join(lines)
          new_text = text[:start] + new_body + text[end:]

          required = [
              'DIRECT_RC=$P_RC',
              'DIRECT_CODE=$P_CODE',
              'DIRECT_TIME=$P_TIME',
              'VPN_RC=$P_RC',
              'VPN_CODE=$P_CODE',
              'VPN_TIME=$P_TIME',
              'reason=DIRECT_UNAVAILABLE_VPN_OK',
              'adguard=NOT_BLOCKED',
              'direct_http=$DIRECT_CODE',
              'vpn_http=$VPN_CODE',
          ]
          for marker in required:
              if new_body.count(marker) != 1:
                  raise SystemExit(f'FAIL: post-patch marker {marker!r} count={new_body.count(marker)} in add_adaptive')

          if new_text.count('reason=DIRECT_UNAVAILABLE_VPN_OK') != 1:
              raise SystemExit('FAIL: reason marker escaped add_adaptive scope')

          path.write_text(new_text, encoding='utf-8')
          print('PATCH_STRUCTURE=PASS')
          PY

      - name: Syntax and scope checks
        shell: bash
        run: |
          set -euo pipefail
          FILE='components/adaptive-routing/scripts/agh-adaptive-live.sh'
          dash -n "$FILE"
          test "$(grep -F -c 'reason=DIRECT_UNAVAILABLE_VPN_OK' "$FILE")" -eq 1
          test "$(grep -F -c 'DIRECT_RC=$P_RC' "$FILE")" -eq 1
          test "$(grep -F -c 'VPN_RC=$P_RC' "$FILE")" -eq 1
          echo "PATCHED_SHA=$(sha256sum "$FILE" | awk '{print $1}')"
          echo 'SYNTAX_SCOPE=PASS'

      - name: Remove one-shot workflow and refresh repository hashes
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/sync-router-adaptive-observability.yml'
          tmp="$RUNNER_TEMP/SHA256SUMS"
          : > "$tmp"
          while IFS= read -r f; do
            [ "$f" = 'SHA256SUMS' ] && continue
            sha256sum "$f" >> "$tmp"
          done < <(git ls-files | LC_ALL=C sort)
          mv "$tmp" SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Repository consistency checks
        shell: bash
        run: |
          set -euo pipefail
          tests/repository/run-consistency-checks.sh
          sha256sum -c SHA256SUMS

      - name: Commit canonical source sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/adaptive-routing/scripts/agh-adaptive-live.sh SHA256SUMS
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 1; }
          git commit -m 'Sync accepted AdaptiveAuto reason logging from router'
          git push origin HEAD:main
