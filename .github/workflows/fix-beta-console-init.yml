name: Fix beta console bootstrap

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-beta-console-init.yml'

permissions:
  contents: write

concurrency:
  group: vward-beta-console-bootstrap-fix
  cancel-in-progress: false

jobs:
  fix-console-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact HTML baseline
        shell: bash
        run: |
          set -euo pipefail
          FILE='web/index.html'
          EXPECTED='fc9815a812e7f31271197f106ab8a01068a727449f307472c282e0accd93d639'
          ACTUAL="$(sha256sum "$FILE" | awk '{print $1}')"
          echo "HTML_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Add regression test for bootstrap order
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('tests/repository/check-console-bindings.py')
          text = path.read_text(encoding='utf-8')
          marker = '''def fail(message: str) -> None:\n    raise SystemExit(f"FAIL: {message}")\n\n\n'''
          addition = '''def fail(message: str) -> None:\n    raise SystemExit(f"FAIL: {message}")\n\n\nscript_start = html.find("<script>")\nscript_end = html.find("</script>", script_start + 8)\nif script_start < 0 or script_end < 0:\n    fail("inline Console JavaScript block is missing")\nscript = html[script_start + len("<script>"):script_end]\ndollar_init = script.find("const $=id=>document.getElementById(id)")\nhelp_bootstrap = script.find("$('helpBtn').innerHTML=svgIcon('bulb')")\nif dollar_init < 0 or help_bootstrap < 0 or dollar_init > help_bootstrap:\n    fail("Console bootstrap uses $ before initialization")\n\n\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'FAIL: test insertion marker count={text.count(marker)}')
          path.write_text(text.replace(marker, addition, 1), encoding='utf-8')
          print('REGRESSION_TEST_ADDED=PASS')
          PY

      - name: RED - verify regression test catches current bug
        shell: bash
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(python3 tests/repository/check-console-bindings.py 2>&1)"
          RC=$?
          set -e
          printf '%s\n' "$OUTPUT"
          test "$RC" -ne 0
          printf '%s\n' "$OUTPUT" | grep -Fq 'Console bootstrap uses $ before initialization'
          echo 'RED_TEST=PASS'

      - name: Fix root cause - initialize DOM helper before first use
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('web/index.html')
          text = path.read_text(encoding='utf-8')

          head_old = "<script>\n'use strict';\nfunction svgIcon(name)"
          head_new = "<script>\n'use strict';\nconst $=id=>document.getElementById(id);\nfunction svgIcon(name)"
          late_old = "const $=id=>document.getElementById(id),M={"
          late_new = "const M={"

          if text.count(head_old) != 1:
              raise SystemExit(f'FAIL: script head marker count={text.count(head_old)}')
          if text.count(late_old) != 1:
              raise SystemExit(f'FAIL: late $ declaration marker count={text.count(late_old)}')

          text = text.replace(head_old, head_new, 1)
          text = text.replace(late_old, late_new, 1)

          if text.count("const $=id=>document.getElementById(id)") != 1:
              raise SystemExit('FAIL: expected exactly one $ initialization after patch')
          if text.find("const $=id=>document.getElementById(id)") > text.find("$('helpBtn').innerHTML=svgIcon('bulb')"):
              raise SystemExit('FAIL: $ initialization is still after first top-level use')

          path.write_text(text, encoding='utf-8')
          print('BOOTSTRAP_PATCH=PASS')
          PY

      - name: GREEN - console regression and syntax checks
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/repository/check-console-bindings.py
          python3 - <<'PY'
          from pathlib import Path
          html = Path('web/index.html').read_text(encoding='utf-8')
          start = html.index('<script>') + len('<script>')
          end = html.index('</script>', start)
          Path('/tmp/vward-console.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/vward-console.js
          echo "PATCHED_HTML_SHA=$(sha256sum web/index.html | awk '{print $1}')"
          echo 'GREEN_TEST=PASS'

      - name: Remove one-shot workflow and refresh repository hashes
        shell: bash
        run: |
          set -euo pipefail
          git rm '.github/workflows/fix-beta-console-init.yml'
          tmp="$RUNNER_TEMP/SHA256SUMS"
          : > "$tmp"
          while IFS= read -r f; do
            [ "$f" = 'SHA256SUMS' ] && continue
            sha256sum "$f" >> "$tmp"
          done < <(git ls-files | LC_ALL=C sort)
          mv "$tmp" SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Full repository consistency checks
        shell: bash
        run: |
          set -euo pipefail
          tests/repository/run-consistency-checks.sh
          sha256sum -c SHA256SUMS
          git diff --check

      - name: Commit beta console bootstrap fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html tests/repository/check-console-bindings.py SHA256SUMS
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 1; }
          git commit -m 'Fix beta Console bootstrap order'
          git push origin HEAD:main
