name: VWARD CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    paths:
      - 'components/update-engine/**'
      - 'config/updater/**'
      - 'config/components/**'
      - 'tests/updater/**'
      - 'tests/perf/**'
      - 'components/**'
      - 'tests/repository/**'
      - 'docs/**'
      - 'README.md'
      - 'web/**'
      - 'updates/dev/**'
      - 'updates/stable/**'
      - 'updates/beta/**'
      - '.github/workflows/updater-ci.yml'
      - 'SHA256SUMS'

permissions:
  contents: read
  actions: write

jobs:
  repository-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Documentation, naming and shell consistency
        run: tests/repository/run-consistency-checks.sh

  resource-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install emulator dependencies
        run: sudo apt-get update && sudo apt-get install -y jq openssl busybox strace gcc libc6-dev

      - name: Fetch beta for the cutover rehearsal
        run: git fetch --no-tags --depth=1 origin beta:refs/remotes/origin/beta

      - name: Route engine on the router emulator
        run: sudo python3 tests/perf/check-route-engine-emulated.py

      - name: Beta to 0.2 cutover on the router emulator
        run: sudo python3 tests/perf/check-cutover-emulated.py

      - name: Resource budget on the router emulator
        run: |
          sudo python3 tests/perf/run-resource-audit.py --seconds 30 \
            --budget tests/perf/resource-budget.json --markdown "$RUNNER_TEMP/resource-audit.md"
          cat "$RUNNER_TEMP/resource-audit.md" >> "$GITHUB_STEP_SUMMARY"

  updater-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq openssl dash busybox

      - name: Ads, HTTPS and domain classifier simulations
        run: tests/run-package-validation.sh

      - name: Shell syntax
        run: |
          set -eu
          for f in components/update-engine/*.sh tests/updater/*.sh; do
            sh -n "$f"
            dash -n "$f"
          done

      - name: Executable modes
        run: |
          set -eu
          for f in components/update-engine/*.sh tests/updater/*.sh; do
            mode=$(git ls-files -s "$f" | awk '{print $1}')
            test "$mode" = 100755
          done

      - name: Base updater simulations
        run: tests/updater/run-simulations.sh

      - name: Fix Pass 1 simulations
        run: tests/updater/run-fix-pass-1-simulations.sh

      - name: Fix Pass 2 simulations
        run: tests/updater/run-fix-pass-2-simulations.sh

      - name: Fix Pass 3 simulations
        run: tests/updater/run-fix-pass-3-simulations.sh

      - name: Update Engine 2 per-file and self-update simulations
        run: tests/updater/run-v2-simulations.sh

      - name: Release rehearsal over beta
        run: |
          git fetch --no-tags --depth=1 origin beta:refs/remotes/origin/beta || echo "beta branch unavailable: minimal seed"
          tests/updater/run-release-rehearsal.sh

      - name: Computed repository SHA256
        run: |
          set -eu
          git ls-files | grep -v '^SHA256SUMS$' | LC_ALL=C sort | xargs sha256sum

      - name: Repository SHA256 manifest
        run: sha256sum -c SHA256SUMS

      - name: SHA256 manifest coverage
        run: |
          set -eu
          git ls-files | grep -v '^SHA256SUMS$' | LC_ALL=C sort > /tmp/vward-tracked.txt
          awk '{print $2}' SHA256SUMS | LC_ALL=C sort > /tmp/vward-manifest.txt
          diff -u /tmp/vward-tracked.txt /tmp/vward-manifest.txt
          tracked_count=$(wc -l < /tmp/vward-tracked.txt | tr -d ' ')
          manifest_count=$(wc -l < /tmp/vward-manifest.txt | tr -d ' ')
          test "$tracked_count" = "$manifest_count"
          printf 'SHA256 coverage: %s/%s tracked files\n' "$manifest_count" "$tracked_count"

  dispatch-transition:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-transition]')
    needs:
      - repository-consistency
      - updater-tests
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch transition publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-transition-hotfix.yml --ref main -R Ziegfe1d/VWARD
