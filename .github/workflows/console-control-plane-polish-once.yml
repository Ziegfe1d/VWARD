name: One-shot VWARD Console control-plane polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/console-control-plane-polish-once.yml'
      - '.github/scripts/console-polish-once.py'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused Console polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/console-polish-once.py')
          s = p.read_text(encoding='utf-8')
          old = '''    if n != 1:\n        raise SystemExit(f"{label}: expected 1 match, found {n}")\n    s = s.replace(old, new, 1)\n'''
          new = '''    if label == "updater state" and n == 2:\n        s = s.replace(old, new, 1)\n        return\n    if n != 1:\n        raise SystemExit(f"{label}: expected 1 match, found {n}")\n    s = s.replace(old, new, 1)\n'''
          if s.count(old) != 1:
              raise SystemExit('temporary patch helper mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/scripts/console-polish-once.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/repository/run-consistency-checks.sh')
          s = p.read_text(encoding='utf-8')
          old = '''grep -Fq "if(id==='logs')loadLog(logName);window.scrollTo(0,0)" web/index.html ||\n    fail "Logs must load before compatibility-safe scroll"'''
          new = '''grep -Fq "if(id==='logs')loadLogs(false);renderHelp();setHelp(false);window.scrollTo(0,0)" web/index.html ||\n    fail "Logs/help must update before compatibility-safe scroll"'''
          if s.count(old) != 1:
              raise SystemExit('console navigation consistency assertion mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/console-control-plane-polish-once.yml
          git rm -f .github/scripts/console-polish-once.py

          tmp="$RUNNER_TEMP/SHA256SUMS"
          : > "$tmp"
          while IFS= read -r f; do
            [ "$f" = "SHA256SUMS" ] && continue
            sha256sum "$f" >> "$tmp"
          done < <(git ls-files | LC_ALL=C sort)
          mv "$tmp" SHA256SUMS

      - name: Validate Console and repository
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/repository/check-console-bindings.py
          tests/repository/run-consistency-checks.sh
          sh -n web/cgi-bin/api.cgi
          sha256sum -c SHA256SUMS
          tests/updater/run-simulations.sh
          tests/updater/run-fix-pass-1-simulations.sh
          tests/updater/run-fix-pass-2-simulations.sh
          tests/updater/run-fix-pass-3-simulations.sh

      - name: Commit focused pass
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish Console logs help and detail states'
          git push origin HEAD:main
